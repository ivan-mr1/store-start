<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Магазин сучасної оптики: широкий вибір стильних оправ, сонцезахисних окулярів та контактних лінз. Професійна перевірка зору та виготовлення окулярів будь-якої складності."
    />

    <title>Оптика — Магазин окулярів та аксесуарів | Перевірка зору</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/img/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/img/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./assets/img/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="./assets/img/favicon/site.webmanifest" />

    <link
      rel="preload"
      href="assets/fonts/Montserrat-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/Montserrat-SemiBold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/Allura-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="stylesheet" href="styles/main.scss" />
    <script type="module" src="js/app.js"></script>
  </head>

  <body>
    <div class="wrapper">
      <header class="header" data-header data-right-padding>
        <div class="header__container">
          <load src="html/components/logo/_logo.html" />
          <div data-header-overlay class="header__overlay">
            <nav class="header__menu menu" data-header-menu>
              <ul class="menu__list">
                <li class="menu__item">
                  <a href="#about" class="menu__link hover-link">ПРО НАС</a>
                </li>
                <li class="menu__item">
                  <a href="#products" class="menu__link hover-link">ПРОДУКТИ</a>
                </li>
                <li class="menu__item">
                  <a href="#footer" class="menu__link hover-link">КОНТАКТИ</a>
                </li>
              </ul>
              <div class="header__soc1al soc1al visible-mobile">
                <ul class="soc1al__list">
                  <li class="soc1al__item">
                    <a
                      href="https://t.me/Optikaonline"
                      class="soc1al__link"
                      target="_blank"
                      rel="noopener"
                      aria-label="Telegram"
                      title="Telegram"
                    >
                      <img
                        src="./assets/img/svg/telegram.svg"
                        alt="Telegram"
                        width="44"
                        height="44"
                        loading="lazy"
                      />
                    </a>
                  </li>
                  <li class="soc1al__item">
                    <a
                      href="https://wa.me/380974501872"
                      class="soc1al__link"
                      target="_blank"
                      rel="noopener"
                      aria-label="whatsapp"
                      title="whatsapp"
                    >
                      <img
                        src="./assets/img/svg/whatsapp.svg"
                        alt="whatsapp"
                        width="44"
                        height="44"
                        loading="lazy"
                      />
                    </a>
                  </li>
                  <li class="soc1al__item">
                    <a
                      href="https://www.instagram.com/optica.ukraine.online/"
                      class="soc1al__link"
                      target="_blank"
                      rel="noopener"
                      aria-label="Instagram"
                      title="Instagram"
                    >
                      <img
                        src="./assets/img/svg/instagram.svg"
                        alt="Instagram"
                        width="44"
                        height="44"
                        loading="lazy"
                      />
                    </a>
                  </li>
                </ul>
              </div>
            </nav>
            <div class="header__actions">
              <load src="shop/favorite/_favorite.html" />
              <load src="shop/cart/_cart-header.html" />
            </div>
          </div>
          <load src="components/header/_burger-btn.html" />
        </div>
      </header>

      <main class="page">
        <section
          class="parent-video-fon page__hero hero"
          aria-labelledby="hero-title"
        >
          <div class="hero__container">
            <div class="hero__body">
              <div class="hero__subtitle">
                <p>
                  Завітайте до нашого магазину — ми допоможемо підібрати
                  ідеальні окуляри та надамо безкоштовну консультацію
                </p>
              </div>
              <h1 class="hero__title" id="hero-title">
                Ми допоможемо вам побачити світ по-новому.
              </h1>
              <div class="hero__buttons">
                <a href="#about" class="hero__button button">ПРО НАС</a>
                <a href="#products" class="hero__button button">ПРОДУКТИ</a>
              </div>
            </div>
          </div>
          <video class="video-fon" autoplay muted loop>
            <source type="video/mp4" src="./assets/video/10.mp4" />
          </video>
          <button
            type="button"
            class="scroll-down-btn"
            data-goto=".about"
            title="scroll down"
            aria-label="scroll-down"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="50"
              height="80"
              viewBox="0 0 50 80"
            >
              <path
                class="first-path"
                fill="#FFFFFF"
                d="M24.752,79.182c-0.397,0-0.752-0.154-1.06-0.463L2.207,57.234c-0.306-0.305-0.458-0.656-0.458-1.057
        s0.152-0.752,0.458-1.059l2.305-2.305c0.309-0.309,0.663-0.461,1.06-0.461c0.398,0,0.752,0.152,1.061,0.461l18.119,18.119
        l18.122-18.119c0.306-0.309,0.657-0.461,1.057-0.461c0.402,0,0.753,0.152,1.059,0.461l2.306,2.305
        c0.308,0.307,0.461,0.658,0.461,1.059s-0.153,0.752-0.461,1.057L25.813,78.719C25.504,79.027,25.15,79.182,24.752,79.182z"
              ></path>
              <path
                class="second-path"
                fill="#FFFFFF"
                d="M24.752,58.25c-0.397,0-0.752-0.154-1.06-0.463L2.207,36.303c-0.306-0.304-0.458-0.655-0.458-1.057
        c0-0.4,0.152-0.752,0.458-1.058l2.305-2.305c0.309-0.308,0.663-0.461,1.06-0.461c0.398,0,0.752,0.153,1.061,0.461l18.119,18.12
        l18.122-18.12c0.306-0.308,0.657-0.461,1.057-0.461c0.402,0,0.753,0.153,1.059,0.461l2.306,2.305
        c0.308,0.306,0.461,0.657,0.461,1.058c0,0.401-0.153,0.753-0.461,1.057L25.813,57.787C25.504,58.096,25.15,58.25,24.752,58.25z"
              ></path>
            </svg>
          </button>
        </section>

        <load src="html/sections/about/_about.html" />
        <load src="html/sections/partners/_partners.html" />

        <section
          id="products"
          class="page__products products"
          aria-labelledby="products-title"
        >
          <div class="products__container">
            <div class="products__header header-block">
              <h1
                class="header-block__title products__title"
                id="products-title"
              >
                Каталог
              </h1>
            </div>
            <ul class="products__list" data-products-catalog></ul>
            <load src="shop/pagination/_pagination.html" />
          </div>
        </section>
      </main>
      <load src="html/layouts/footer/_footer.html" />
    </div>
  </body>
</html>
